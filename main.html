setTrips(data.content);
localStorage.setItem('travel_with_me_trips_v3', JSON.stringify(data.content));
} else {
await supabaseClient.from('travel_trips').upsert({ id: 1, content: trips });
}
} catch (e) { console.warn("目前使用本地緩存大禮包流暢運行中"); }
};
