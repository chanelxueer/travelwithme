        // 解構出所有美觀的網頁圖標

            Share2, Camera, CheckCircle2, Circle, ExternalLink, Navigation, CloudSun,
            ChevronLeft, BedDouble, Smile
        } = lucide;

        // ========================================================
        // 🔑 關鍵步驟：請在下方雙引號內填入你在 Supabase 複製的真實金鑰
        // ========================================================
        const SUPABASE_URL = "https://ztbozybvkyoaxrrushqm.supabase.co/rest/v1/";
        const SUPABASE_ANON_KEY = "sb_publishable_LnfjU3Q3D0NlHxg76p7feQ_R5TlEvUr";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 馬幣（MYR）匯率自動換算基準
        const CURRENCY_RATES_TO_MYR = {
            MYR: 1.0,
            JPY: 0.029, // 1 JPY = 0.029 MYR
            THB: 0.13,  // 1 THB = 0.13 MYR
            KRW: 0.0034,// 1 KRW = 0.0034 MYR
            SGD: 3.52,  // 1 SGD = 3.52 MYR
            TWD: 0.14,  // 1 TWD = 0.14 MYR
            USD: 4.45,  // 1 USD = 4.45 MYR
            EUR: 4.85   // 1 EUR = 4.85 MYR
        };

        // 初始示範旅程資料（如果雲端資料庫是空的，網頁會自動把這份初始資料推上雲端）
        const INITIAL_TRIPS = [
            {
                id: 'trip-tokyo-2026',
                title: '日本东京 5天4夜冬季美食与雪景之旅',
                destination: '日本 · 东京 (Tokyo)',
                startDate: '2026-12-25',
                endDate: '2026-12-29',
                status: 'upcoming',
                currency: 'JPY',
                budgetMYR: 5500,
                companions: ['我 (主理人)', 'Aiden', 'Jing Yi'],
                coverGradient: 'from-amber-800 via-stone-800 to-amber-950',
                days: [
                    { dayNum: 1, date: '2026-12-25', title: '抵达东京 · 银座圣诞夜', weatherNote: '5°C 晴', stops: [{ id: 's1', time: '14:00', name: '银座 Ginza Six 逛街', category: '景点', address: 'Ginza, Tokyo', openHours: '11:00-20:00', duration: '3小时', notes: '欣賞聖誕燈飾', photoUrl: 'https://unsplash.com' }] },
                    { dayNum: 2, date: '2026-12-26', title: '浅草寺祈福 & 晴空塔夜景', weatherNote: '3°C 晴', stops: [] },
                    { dayNum: 3, date: '2026-12-27', title: '筑地美食暴击 · 涩谷潮流', weatherNote: '6°C 多云', stops: [] },
                    { dayNum: 4, date: '2026-12-28', title: '新宿御苑冬日漫步', weatherNote: '4°C 晴', stops: [] },
                    { dayNum: 5, date: '2026-12-29', title: '表参道采购伴手礼 & 返程', weatherNote: '5°C 晴', stops: [] }
                ],
                expenses: [
                    { id: 'ex1', title: '成田特快 NEX 车票', category: '交通', amountLocal: 8000, currency: 'JPY', amountMYR: 232, paidBy: '我 (主理人)' }
                ],
                checklist: [
                    { id: 'ck1', category: '证件与金融', text: '马来西亚护照 (6个月有效期)', checked: true },
                    { id: 'ck2', category: '电子与网络', text: '日本 eSIM 上网卡', checked: false }
                ],
                memories: [
                    { id: 'm1', title: '落地东京第一杯热抹茶', dayTag: 'Day 1', mood: '☕ 悠闲时光', author: '我 (主理人)', date: '2026-12-25', note: '喝到抹茶瞬间开启度假模式！', mediaUrl: 'https://unsplash.com' }
                ]
            }
        ];

        function App() {
            const [trips, setTrips] = React.useState(INITIAL_TRIPS);
            const [selectedTripId, setSelectedTripId] = React.useState(null);
            const [activeTab, setActiveTab] = React.useState('itinerary'); 
            const [activeDayNum, setActiveDayNum] = React.useState(1);
            
            // 彈窗狀態
            const [showNewTripModal, setShowNewTripModal] = React.useState(false);
            const [showAddStopModal, setShowAddStopModal] = React.useState(false);
            const [showAddExpenseModal, setShowAddExpenseModal] = React.useState(false);
            const [showAddMemoryModal, setShowAddMemoryModal] = React.useState(false);
            const [showAddChecklistModal, setShowAddChecklistModal] = React.useState(false);
            const [toastMsg, setToastMsg] = React.useState('');

            // 1. 網頁開啟時，立刻去 Supabase 雲端資料庫下載最新數據
            React.useEffect(() => {
                fetchTripsFromCloud();
            }, []);

            const fetchTripsFromCloud = async () => {
                try {
                    const { data, error } = await supabaseClient.from('travel_trips').select('*').eq('id', 1).maybeSingle();
                    if (data && data.content) {
                        setTrips(data.content);
                    } else {
                        // 如果雲端資料庫完全是空的，就自動初始化建立第一筆資料
                        await supabaseClient.from('travel_trips').upsert({ id: 1, content: INITIAL_TRIPS });
                    }
                } catch (e) {
                    console.error("雲端連線失敗:", e);
                }
            };

            // 2. 核心大絕招：當我們在網頁操作修改後，立刻推送並覆蓋雲端資料庫
            const syncToCloud = async (newTrips) => {
                setTrips(newTrips);
                try {
                    await supabaseClient.from('travel_trips').upsert({ id: 1, content: newTrips });
                } catch (e) {
                    console.error("同步雲端失敗:", e);
                }
            };

            const triggerToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            const selectedTrip = trips.find((t) => t.id === selectedTripId);

            // 倒數計時計算器
            const getDaysCountdown = (startDateStr) => {
                const today = new Date(); today.setHours(0,0,0,0);
                const start = new Date(startDateStr); start.setHours(0,0,0,0);
                const diffTime = start - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays > 0) return `还有 ${diffDays} 天出发`;
                if (diffDays === 0) return `今天出发！✈️`;
                return `行程已进行或结束`;
            };

            // 建立新旅程
            const handleCreateTrip = async (e) => {
                e.preventDefault();
                const form = e.target;
                const title = form.title.value.trim();
                const destination = form.destination.value.trim();
                const startDate = form.startDate.value;
                const endDate = form.endDate.value;
                const currency = form.currency.value;
                const budgetMYR = Number(form.budgetMYR.value) || 3000;
                const companionsRaw = form.companions.value.trim();
                const companions = companionsRaw ? companionsRaw.split(/[,，]/).map(s => s.trim()).filter(Boolean) : ['我 (主理人)'];

                const generatedDays = [{ dayNum: 1, date: startDate, title: `第 1 天行程規劃`, weatherNote: '晴朗', stops: [] }];

                const newTrip = {
                    id: `trip-${Date.now()}`, title, destination, startDate, endDate, status: 'upcoming',
                    currency, budgetMYR, companions, coverGradient: 'from-amber-800 via-stone-800 to-amber-950',
                    days: generatedDays, expenses: [], checklist: [], memories: []
                };

                const updatedTrips = [newTrip, ...trips];
                await syncToCloud(updatedTrips);
                setSelectedTripId(newTrip.id);
                setShowNewTripModal(false);
                triggerToast('🚀 新旅程已成功建立並同步雲端！');
            };

            // 新增行程停留點
            const handleAddStop = async (e) => {
                e.preventDefault();
                const form = e.target;
                const newStop = {
                    id: `stop-${Date.now()}`,
                    time: form.time.value,
                    name: form.name.value.trim(),
                    category: form.category.value,
                    address: form.address.value.trim() || '未設定地址',
                    openHours: form.openHours.value.trim() || '全天開放',
                    duration: form.duration.value.trim() || '1-2小時',
                    notes: form.notes.value.trim(),
                    photoUrl: form.photoUrl.value.trim() || 'https://unsplash.com'
                };

                const updatedTrips = trips.map(t => {
                    if (t.id === selectedTrip.id) {
                        const updatedDays = t.days.map(d => d.dayNum === activeDayNum ? { ...d, stops: [...d.stops, newStop] } : d);
                        return { ...t, days: updatedDays };
                    }
                    return t;
                });

                await syncToCloud(updatedTrips);
                setShowAddStopModal(false);
                triggerToast('✓ 行程點已加入雲端！');
            };

            // 記一筆花費（自動折算馬幣）
            const handleAddExpense = async (e) => {
                e.preventDefault();
                const form = e.target;
                const amountLocal = Number(form.amountLocal.value) || 0;
                const rate = CURRENCY_RATES_TO_MYR[selectedTrip.currency] || 1.0;

                const newExp = {
                    id: `exp-${Date.now()}`,
title: form.title.value.trim(),
category: form.category.value,
amountLocal,
currency: selectedTrip.currency,
amountMYR: Number((amountLocal * rate).toFixed(2)),
paidBy: form.paidBy.value
};
const updatedTrips = trips.map(t => {
if (t.id === selectedTrip.id) {
return { ...t, expenses: [newExp, ...(t.expenses || [])] };
}
return t;
});
await syncToCloud(updatedTrips);
setShowAddExpenseModal(false);
triggerToast('💰 雲端記帳成功！夥伴重新整理即可看到！');
};
// 上傳影像回憶
const handleAddMemory = async (e) => {
e.preventDefault();
const form = e.target;
const newMem = {
id: mem-${Date.now()},
title: form.title.value.trim(),
dayTag: form.dayTag.value,
mood: form.mood.value,
author: form.author.value.trim() || '主理人',
date: new Date().toISOString().slice(0, 10),
note: form.note.value.trim(),
mediaUrl: form.mediaUrl.value.trim() || 'unsplash.com'
};
const updatedTrips = trips.map(t => {
if (t.id === selectedTrip.id) {
return { ...t, memories: [newMem, ...(t.memories || [])] };
}
return t;
});
await syncToCloud(updatedTrips);
setShowAddMemoryModal(false);
triggerToast('📸 回憶已成功打包飛上雲端！');
};
// 打勾/取消行李打包清單
const handleToggleChecklist = async (itemId) => {
const updatedTrips = trips.map(t => {
if (t.id === selectedTrip.id) {
const updatedCheck = t.checklist.map(item => item.id === itemId ? { ...item, checked: !item.checked } : item);
return { ...t, checklist: updatedCheck };
}
return t;
});
await syncToCloud(updatedTrips);
};
// 新增行李物品
const handleAddChecklistItem = async (e) => {
e.preventDefault();
const form = e.target;
const newItem = { id: ck-${Date.now()}, category: form.category.value, text: form.text.value.trim(), checked: false };
const updatedTrips = trips.map(t => {
if (t.id === selectedTrip.id) {
return { ...t, checklist: [...t.checklist, newItem] };
}
return t;
});
await syncToCloud(updatedTrips);
setShowAddChecklistModal(false);
triggerToast('🎒 物品已歸入清單！');
};

React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
return ;
};
